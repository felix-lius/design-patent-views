<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1560" viewBox="0 0 1000 1560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
</defs>
<rect width="1000" height="1560" fill="#ffffff"/>
<text x="500" y="44" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="bold">外观设计专利视图自动生成 — 实现流程图</text>
<text x="500" y="70" text-anchor="middle" font-size="13" fill="#475569">六视图 + 立体图 + JPEG 提交件 + 可编辑 DXF ｜ 全程本地运行，模型不上传</text>
<ellipse cx="500" cy="118" rx="96" ry="22" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="500" y="123" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">开始：本地批处理</text>
<path d="M 500 140 L 500 158" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300" y="158" width="400" height="66" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="500.0" y="174.0" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">输入准备</text>
<text x="500.0" y="193.0" text-anchor="middle" font-size="11" fill="#475569">STEP / STP 模型文件</text>
<text x="500.0" y="210.0" text-anchor="middle" font-size="11" fill="#475569">产品名 / 用途 / 主视图方位 / 上方向</text>
<path d="M 500 224 L 500 242" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="270" y="242" width="460" height="78" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="500.0" y="255.5" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">① 输入解析与校验</text>
<text x="500.0" y="274.5" text-anchor="middle" font-size="11" fill="#475569">STEP → OCP 载入（B-Rep 实体拓扑）</text>
<text x="500.0" y="291.5" text-anchor="middle" font-size="11" fill="#475569">逐实体 BRepCheck：破面 / 自交 → 警告不中断</text>
<text x="500.0" y="308.5" text-anchor="middle" font-size="11" fill="#475569">格式校验：仅接受 .step / .stp</text>
<path d="M 730 281 L 752 281" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowred)"/>
<rect x="752" y="250" width="208" height="62" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="856.0" y="264.0" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="bold">失败 → 错误报告</text>
<text x="856.0" y="283.0" text-anchor="middle" font-size="11" fill="#475569">非 STEP / 文件截断 / 无法解析</text>
<text x="856.0" y="300.0" text-anchor="middle" font-size="11" fill="#475569">不进入后续步骤</text>
<path d="M 500 320 L 500 338" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="500,338.0 625.0,366 500,394.0 375.0,366" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="500" y="364" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="bold">人工确认点 ①</text>
<text x="500" y="381" text-anchor="middle" font-size="10" fill="#475569">核对主视图方位</text>
<path d="M 500 394 L 500 412" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="260" y="412" width="480" height="78" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="500.0" y="425.5" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">② 几何预处理</text>
<text x="500.0" y="444.5" text-anchor="middle" font-size="11" fill="#475569">按主视图方位定轴系 → 计算包围盒</text>
<text x="500.0" y="461.5" text-anchor="middle" font-size="11" fill="#475569">推导六视图方位 + 统一比例（六视图共用 scale）</text>
<text x="500.0" y="478.5" text-anchor="middle" font-size="11" fill="#475569">投影一致性自校验（长对正 / 高平齐 / 宽相等）</text>
<path d="M 500 490 L 500 508" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="500,508.0 620.0,536 500,564.0 380.0,536" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="500" y="534" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="bold">出图模式</text>
<text x="500" y="551" text-anchor="middle" font-size="10" fill="#475569">整体 / 局部外观</text>
<path d="M 620 536 L 742 536" fill="none" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<rect x="742" y="498" width="218" height="76" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="851.0" y="510.5" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="bold">局部外观模式</text>
<text x="851.0" y="529.5" text-anchor="middle" font-size="11" fill="#475569">实线 = 要求保护的局部</text>
<text x="851.0" y="546.5" text-anchor="middle" font-size="11" fill="#475569">虚线 = 其他部分</text>
<text x="851.0" y="563.5" text-anchor="middle" font-size="11" fill="#475569">无明确分界线 → 点划线</text>
<path d="M 500 564 L 500 582" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="500,585.0 558.0,602 500,619.0 442.0,602" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
<text x="500" y="606" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="bold">并行</text>
<path d="M 442 602 L 350 602 L 350 626" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 558 602 L 650 602 L 650 626" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="626" width="300" height="84" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="350.0" y="642.5" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">③a 六视图（正交投影）</text>
<text x="350.0" y="661.5" text-anchor="middle" font-size="11" fill="#475569">OCP HLR 隐藏线消除</text>
<text x="350.0" y="678.5" text-anchor="middle" font-size="11" fill="#475569">主 / 后 / 左 / 右 / 俯 / 仰</text>
<text x="350.0" y="695.5" text-anchor="middle" font-size="11" fill="#475569">关闭隐藏线（虚线禁用）</text>
<rect x="500" y="626" width="300" height="84" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="650.0" y="642.5" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">③b 立体图（等轴测线框）</text>
<text x="650.0" y="661.5" text-anchor="middle" font-size="11" fill="#475569">方位 45° / 仰角 35.264°</text>
<text x="650.0" y="678.5" text-anchor="middle" font-size="11" fill="#475569">线框图，不用着色渲染</text>
<text x="650.0" y="695.5" text-anchor="middle" font-size="11" fill="#475569">比例独立（不受六视图约束）</text>
<path d="M 350 710 L 350 736 L 500 736" fill="none" stroke="#475569" stroke-width="1.5"/>
<path d="M 650 710 L 650 736 L 500 736" fill="none" stroke="#475569" stroke-width="1.5"/>
<path d="M 500 736 L 500 754" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="270" y="754" width="460" height="92" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="500.0" y="766.0" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">④ 专利规范化处理（官方规格固化）</text>
<text x="500.0" y="785.0" text-anchor="middle" font-size="11" fill="#475569">统一线宽实线（0.25–0.50mm），无多余线条</text>
<text x="500.0" y="802.0" text-anchor="middle" font-size="11" fill="#475569">版面 150×220mm @300DPI → 1772×2598 px，JPEG</text>
<text x="500.0" y="819.0" text-anchor="middle" font-size="11" fill="#475569">产品图形 ≥ 3cm×8cm（细长物品除外）</text>
<text x="500.0" y="836.0" text-anchor="middle" font-size="11" fill="#475569">提交件中文命名：1-主视图 … 7-立体图</text>
<path d="M 500 846 L 500 864" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="262" y="864" width="476" height="92" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="500.0" y="876.0" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">⑤ 合规自检（33 项硬性校验）</text>
<text x="500.0" y="895.0" text-anchor="middle" font-size="11" fill="#475569">格式：JPEG / DPI / 像素区间 / 总大小 ≤ 30MB</text>
<text x="500.0" y="912.0" text-anchor="middle" font-size="11" fill="#475569">线条：线型禁令、线宽统一、图内无文字与图号</text>
<text x="500.0" y="929.0" text-anchor="middle" font-size="11" fill="#475569">视图：数量、命名、长对正 / 高平齐 / 宽相等</text>
<text x="500.0" y="946.0" text-anchor="middle" font-size="11" fill="#475569">清晰度：缩小 2/3 可辨、轮廓完整性（人工复核）</text>
<path d="M 738 910 L 760 910" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowred)"/>
<rect x="760" y="872" width="200" height="76" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="860.0" y="893.0" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="bold">不合规 → 返回修正</text>
<text x="860.0" y="912.0" text-anchor="middle" font-size="11" fill="#475569">自动重出图（换比例 / 线宽）</text>
<text x="860.0" y="929.0" text-anchor="middle" font-size="11" fill="#475569">仍不合规 → 转人工复核</text>
<path d="M 500 956 L 500 974" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="500,974.0 605.0,1002 500,1030.0 395.0,1002" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="500" y="1006" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="bold">合规通过？</text>
<path d="M 605 1002 L 860 1002 L 860 950" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowred)"/>
<text x="700" y="994" text-anchor="middle" font-size="11" fill="#b85450">否</text>
<path d="M 500 1030 L 500 1048" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="512" y="1044" text-anchor="start" font-size="11" fill="#475569">是</text>
<rect x="250" y="1048" width="500" height="92" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="500.0" y="1060.0" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">⑥ 交付</text>
<text x="500.0" y="1079.0" text-anchor="middle" font-size="11" fill="#475569">output/&lt;产品名&gt;/submission/  →  7 张 JPEG 提交件（可直接上传）</text>
<text x="500.0" y="1096.0" text-anchor="middle" font-size="11" fill="#475569">output/&lt;产品名&gt;/all_views.dxf  →  1:1 mm 可编辑矢量</text>
<text x="500.0" y="1113.0" text-anchor="middle" font-size="11" fill="#475569">logs/05_&lt;name&gt;.json  →  33 项合规自检报告</text>
<text x="500.0" y="1130.0" text-anchor="middle" font-size="11" fill="#475569">每个模型一个独立目录，同名自动加序号，不互相覆盖</text>
<path d="M 500 1140 L 500 1158" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="500,1158.0 630.0,1186 500,1214.0 370.0,1186" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="500" y="1184" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="bold">人工确认点 ②</text>
<text x="500" y="1201" text-anchor="middle" font-size="10" fill="#475569">按自检报告与图面复核</text>
<path d="M 500 1214 L 500 1232" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<ellipse cx="500" cy="1258" rx="128" ry="24" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="500" y="1263" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">结束：可用于专利申请提交</text>
<rect x="40" y="1310" width="920" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="70" y="1336" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">图例</text>
<rect x="70" y="1348" width="26" height="16" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="106" y="1361" text-anchor="start" font-size="11" fill="#475569">自动化处理（OCP / Python）</text>
<rect x="390" y="1348" width="26" height="16" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="426" y="1361" text-anchor="start" font-size="11" fill="#475569">交付物</text>
<rect x="650" y="1348" width="26" height="16" rx="3" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="686" y="1361" text-anchor="start" font-size="11" fill="#475569">局部外观模式</text>
<polygon points="83,1378.0 96.0,1386 83,1394.0 70.0,1386" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="83" y="1390" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="bold"></text>
<text x="106" y="1391" text-anchor="start" font-size="11" fill="#475569">人工确认点</text>
<rect x="390" y="1378" width="26" height="16" rx="3" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="426" y="1391" text-anchor="start" font-size="11" fill="#475569">异常 / 不合规分支（含返回修正回路）</text>
<text x="650" y="1391" text-anchor="start" font-size="11" fill="#b85450">红色虚线 = 异常路径</text>
<text x="40" y="1444" text-anchor="start" font-size="12" fill="#1e293b" font-weight="bold">实现文件（scripts/）：</text>
<text x="40" y="1466" text-anchor="start" font-size="11" fill="#475569">patent_cli.py 命令行主入口 ／ spec.py 合规常量 ／ pipeline.py 路径与日志 ／ userconfig.py 用户偏好</text>
<text x="40" y="1486" text-anchor="start" font-size="11" fill="#475569">step01_parse_validate.py ① ／ step02_orient.py ② ／ step03_views.py ③ ／ step04_normalize.py ④ ／ step05_compliance_check.py ⑤</text>
<text x="40" y="1506" text-anchor="start" font-size="11" fill="#475569">geom_core.py 几何与 HLR ／ render.py 光栅化 ／ dxf_export.py DXF ／ extract_solids.py 实体筛选 ／ verify_dxf.py DXF 回读验证</text>
<text x="40" y="1532" text-anchor="start" font-size="11" fill="#94a3b8">依据：CNIPA《关于规范提交专利电子申请指引的通知》(2023-05-29)、《专利审查指南》(2024)、专利法实施细则第 30 条</text>
</svg>