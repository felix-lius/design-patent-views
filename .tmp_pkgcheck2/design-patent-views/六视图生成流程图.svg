<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2060" viewBox="0 0 1000 2060" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="1000" height="2060" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">外观专利六视图自动生成 — 实现流程图（本地开源版 · 合规规格已固化）</text>

  <!-- 开始 -->
  <ellipse cx="480" cy="75" rx="110" ry="26" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="480" y="80" text-anchor="middle" font-size="14" fill="#1e293b">开始：本地批处理</text>
  <line x1="480" y1="101" x2="480" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 输入 -->
  <polygon points="400,134 620,134 590,196 370,196" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="495" y="156" text-anchor="middle" font-size="13" fill="#1e293b">输入准备</text>
  <text x="495" y="176" text-anchor="middle" font-size="12" fill="#475569">STEP/STP + config（产品名称/用途/主视图方位/</text>
  <text x="495" y="191" text-anchor="middle" font-size="12" fill="#475569">整体 or 局部外观 / 省略视图及原因）</text>
  <line x1="480" y1="196" x2="480" y2="224" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ① -->
  <rect x="350" y="228" width="260" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="480" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">① 输入解析与校验</text>
  <text x="480" y="272" text-anchor="middle" font-size="12" fill="#475569">STEP → FreeCAD Part 导入</text>
  <text x="480" y="290" text-anchor="middle" font-size="12" fill="#475569">破面/非流形检查 → 警告不中断</text>
  <line x1="610" y1="267" x2="700" y2="267" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowred)"/>
  <rect x="704" y="237" width="176" height="60" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.2"/>
  <text x="792" y="261" text-anchor="middle" font-size="12" fill="#7a2e2a">失败 → 错误报告</text>
  <text x="792" y="281" text-anchor="middle" font-size="12" fill="#7a2e2a">跳过该文件</text>
  <line x1="480" y1="306" x2="480" y2="334" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 人工确认① -->
  <polygon points="480,338 620,372 480,406 340,372" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="480" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4b00">人工确认点 ①</text>
  <text x="480" y="386" text-anchor="middle" font-size="12" fill="#7a4b00">核对主视图方位</text>
  <line x1="480" y1="406" x2="480" y2="434" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ② -->
  <rect x="340" y="438" width="280" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="480" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">② 几何预处理</text>
  <text x="480" y="482" text-anchor="middle" font-size="12" fill="#475569">按主视图方位重定向 → 计算包围盒</text>
  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#475569">推导六视图方位 + 自适应比例（六视图比例一致）</text>
  <line x1="480" y1="516" x2="480" y2="544" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 出图模式判定 -->
  <polygon points="480,548 620,588 480,628 340,588" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="480" y="582" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a3466">出图模式</text>
  <text x="480" y="601" text-anchor="middle" font-size="12" fill="#4a3466">整体 / 局部外观</text>
  <line x1="620" y1="588" x2="700" y2="588" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <rect x="704" y="544" width="256" height="92" rx="8" fill="#f3edf9" stroke="#9673a6" stroke-width="1.2"/>
  <text x="720" y="566" font-size="12" font-weight="bold" fill="#4a3466">局部外观模式（细则30条2款）</text>
  <text x="720" y="586" font-size="12" fill="#4a3466">实线 = 要求保护的局部</text>
  <text x="720" y="604" font-size="12" fill="#4a3466">虚线 = 其他部分</text>
  <text x="720" y="622" font-size="12" fill="#4a3466">无明确分界线 → 点划线表示分界</text>
  <line x1="480" y1="628" x2="480" y2="660" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 并行分叉 -->
  <polygon points="480,664 518,690 480,716 442,690" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="480" y="695" text-anchor="middle" font-size="11" fill="#4a3466">并行</text>
  <line x1="442" y1="690" x2="330" y2="690" stroke="#475569" stroke-width="1.5"/>
  <line x1="330" y1="690" x2="330" y2="726" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="518" y1="690" x2="630" y2="690" stroke="#475569" stroke-width="1.5"/>
  <line x1="630" y1="690" x2="630" y2="726" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ③a -->
  <rect x="200" y="730" width="260" height="94" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="330" y="754" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">③a 六视图（正交投影）</text>
  <text x="330" y="774" text-anchor="middle" font-size="12" fill="#475569">TechDraw 第一角投影，主/后/左/右/俯/仰</text>
  <text x="330" y="792" text-anchor="middle" font-size="12" fill="#7a2e2a">关闭隐藏线（虚线禁用）</text>
  <text x="330" y="810" text-anchor="middle" font-size="12" fill="#475569">长对正 / 高平齐 / 宽相等</text>
  <line x1="330" y1="824" x2="330" y2="852" stroke="#475569" stroke-width="1.5"/>
  <line x1="330" y1="852" x2="455" y2="852" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ③b -->
  <rect x="500" y="730" width="260" height="94" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="630" y="754" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">③b 立体图（等轴测线框）</text>
  <text x="630" y="774" text-anchor="middle" font-size="12" fill="#475569">侧 45° 视角</text>
  <text x="630" y="792" text-anchor="middle" font-size="12" fill="#7a2e2a">线框图，不用着色渲染</text>
  <text x="630" y="810" text-anchor="middle" font-size="12" fill="#475569">与六视图同比例</text>
  <line x1="630" y1="824" x2="630" y2="852" stroke="#475569" stroke-width="1.5"/>
  <line x1="630" y1="852" x2="505" y2="852" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 汇合 -->
  <polygon points="480,856 518,882 480,908 442,882" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <line x1="480" y1="908" x2="480" y2="938" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ④ -->
  <rect x="270" y="942" width="420" height="118" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"/>
  <text x="480" y="966" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">④ 专利规范化处理（官方规格固化）</text>
  <text x="480" y="988" text-anchor="middle" font-size="12" fill="#475569">线型：粗细均匀实线，统一线宽（建议 0.25–0.5mm），无多余线条</text>
  <text x="480" y="1006" text-anchor="middle" font-size="12" fill="#475569">版面：150mm × 220mm @300DPI → 1772 × 2598 px，JPEG</text>
  <text x="480" y="1024" text-anchor="middle" font-size="12" fill="#475569">产品图形 ≥ 3cm × 8cm（细长物品除外）</text>
  <text x="480" y="1042" text-anchor="middle" font-size="12" fill="#475569">视图名称标注于视图正下方；图片内不含文字与图号</text>

  <!-- 不合规 → 返回修正 -->
  <rect x="710" y="952" width="250" height="76" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.2"/>
  <text x="835" y="976" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2e2a">不合规 → 返回修正</text>
  <text x="835" y="996" text-anchor="middle" font-size="12" fill="#7a2e2a">自动重出图（换比例/线宽）</text>
  <text x="835" y="1014" text-anchor="middle" font-size="12" fill="#7a2e2a">仍不合规则转人工复核</text>

  <line x1="480" y1="1060" x2="480" y2="1090" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑤ -->
  <rect x="270" y="1094" width="420" height="118" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"/>
  <text x="480" y="1118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">⑤ 合规自检（硬性校验清单）</text>
  <text x="480" y="1140" text-anchor="middle" font-size="12" fill="#475569">格式：JPEG｜DPI 72–300｜像素 467.7×694.4 ～ 1948.8×2893.7</text>
  <text x="480" y="1158" text-anchor="middle" font-size="12" fill="#475569">图形尺寸区间｜缩小至 2/3 细节可辨｜总大小 ≤ 30MB</text>
  <text x="480" y="1176" text-anchor="middle" font-size="12" fill="#475569">禁线型检测（虚线/中心线/尺寸线/点划线/阴影线）</text>
  <text x="480" y="1194" text-anchor="middle" font-size="12" fill="#475569">六视图比例一致｜投影对齐｜视图命名齐全｜图内无文字</text>
  <line x1="480" y1="1212" x2="480" y2="1242" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 决策 -->
  <polygon points="480,1246 570,1298 480,1350 390,1298" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="480" y="1294" text-anchor="middle" font-size="13" fill="#1e293b">合规</text>
  <text x="480" y="1312" text-anchor="middle" font-size="13" fill="#1e293b">通过？</text>
  <line x1="570" y1="1298" x2="700" y2="1298" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowred)"/>
  <text x="620" y="1290" font-size="12" fill="#b85450">否</text>
  <path d="M 835 1298 L 835 990 L 694 990" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowred)"/>
  <line x1="480" y1="1350" x2="480" y2="1382" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="1372" font-size="12" fill="#475569">是</text>

  <!-- ⑥ -->
  <rect x="270" y="1386" width="420" height="120" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="480" y="1410" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">⑥ 简要说明文书生成</text>
  <text x="480" y="1432" text-anchor="middle" font-size="12" fill="#475569">必填：产品名称｜用途｜设计要点</text>
  <text x="480" y="1450" text-anchor="middle" font-size="12" fill="#475569">指定一幅最能表明设计要点的视图（公报出版用）</text>
  <text x="480" y="1468" text-anchor="middle" font-size="12" fill="#475569">按情形补充：省略视图及原因｜变化状态｜透明部分｜色彩</text>
  <text x="480" y="1486" text-anchor="middle" font-size="12" fill="#7a2e2a">禁用商业宣传用语；不得说明性能与内部结构</text>
  <line x1="480" y1="1506" x2="480" y2="1536" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑦ -->
  <rect x="250" y="1540" width="460" height="104" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="480" y="1564" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">⑦ 打包交付 output/&lt;产品名&gt;/</text>
  <text x="480" y="1586" text-anchor="middle" font-size="12" fill="#475569">六视图 JPEG ×6 + 立体图 + 六视图合版图</text>
  <text x="480" y="1604" text-anchor="middle" font-size="12" fill="#475569">简要说明.docx</text>
  <text x="480" y="1622" text-anchor="middle" font-size="12" fill="#475569">合规自检报告.json + 提交核对清单.md</text>
  <line x1="480" y1="1644" x2="480" y2="1674" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 人工确认② -->
  <polygon points="480,1678 620,1714 480,1750 340,1714" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="480" y="1709" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4b00">人工确认点 ②</text>
  <text x="480" y="1728" text-anchor="middle" font-size="12" fill="#7a4b00">按提交核对清单复核</text>
  <line x1="480" y1="1750" x2="480" y2="1778" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 结束 -->
  <ellipse cx="480" cy="1806" rx="130" ry="26" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="480" y="1811" text-anchor="middle" font-size="14" fill="#1e293b">结束：可用于专利申请提交</text>

  <!-- 图例 -->
  <rect x="60" y="1870" width="880" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="1896" font-size="13" font-weight="bold" fill="#1e293b">图例</text>
  <rect x="80" y="1910" width="24" height="15" rx="3" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="112" y="1922" font-size="12" fill="#475569">自动化处理（FreeCAD / Python）</text>
  <polygon points="92,1948 110,1955 92,1962 74,1955" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="112" y="1959" font-size="12" fill="#475569">人工确认点</text>
  <rect x="400" y="1910" width="24" height="15" rx="3" fill="#d5e8d4" stroke="#82b366"/>
  <text x="432" y="1922" font-size="12" fill="#475569">文书生成 / 交付</text>
  <rect x="400" y="1946" width="24" height="15" rx="3" fill="#f8cecc" stroke="#b85450"/>
  <text x="432" y="1958" font-size="12" fill="#475569">异常 / 不合规分支（含返回修正回路）</text>
  <rect x="700" y="1910" width="24" height="15" rx="3" fill="#f3edf9" stroke="#9673a6"/>
  <text x="732" y="1922" font-size="12" fill="#475569">局部外观模式</text>
  <text x="700" y="1958" font-size="12" fill="#7a2e2a">红字 = 硬性禁用项</text>

  <!-- 底部说明 -->
  <text x="80" y="1996" font-size="12.5" font-weight="bold" fill="#334155">Skill 包结构：</text>
  <text x="80" y="2016" font-size="12" fill="#64748b">①01_parse_validate.py　②02_orient.py（FreeCAD 宏）　③03_generate_views.py　④04_normalize.py　⑤05_compliance_check.py</text>
  <text x="80" y="2034" font-size="12" fill="#64748b">⑥06_brief_doc.py　⑦run_batch.py 总入口　＋ templates/简要说明模板.docx　＋ references/CNIPA制图合规规格.md</text>
  <text x="80" y="2052" font-size="11.5" fill="#94a3b8">依据：CNIPA《关于规范提交专利电子申请指引的通知》(2023-05-29)、专利审查指南(2024)、专利法实施细则第30条 · 2026-10-28</text>
</svg>
